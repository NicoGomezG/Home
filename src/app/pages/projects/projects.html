<section class="mx-auto max-w-4xl px-6 py-16">
  <h1 class="text-3xl font-bold tracking-tight text-neutral-100">Proyectos</h1>
  <p class="mt-2 text-neutral-400">
    Páginas y proyectos que he desarrollado.
  </p>

  @if (loading()) {
    <p class="mt-8 text-sm text-neutral-500">Cargando proyectos…</p>
  } @else {
    <div class="mt-8 grid gap-5 sm:grid-cols-2">
      @for (project of projects(); track project.id) {
        <app-project-card [project]="project" />
      }
    </div>
  }
</section>
